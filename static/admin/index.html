<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · BBB Blinken Bulbs</title>
  <link rel="stylesheet" href="/css/site.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/">BBB Blinken Bulbs</a>
    <a href="/play/">Playground</a>
    <a href="/gallery/">Gallery</a>
    <a href="/status/">Live</a>
    <a href="/admin/" aria-current="page">Admin</a>
  </nav>
  <main class="page wide">
    <h1>Review shows</h1>
    <div id="tabs" class="admin-tabs" role="group" aria-label="Status"></div>
    <p id="message" class="admin-message" role="status"></p>
    <div class="admin">
      <ul id="list" class="admin-list"></ul>
      <section id="detail" class="admin-detail" hidden>
        <div id="view" class="card-view"></div>
        <p id="preview-status" class="muted"></p>
        <form id="form">
          <label for="title">Title</label>
          <input id="title" maxlength="100" required>
          <label for="author">Author</label>
          <input id="author" maxlength="100">
          <label for="description">Description</label>
          <textarea id="description" rows="2" maxlength="1000"></textarea>
          <label for="note">Note (only visible to admins)</label>
          <textarea id="note" rows="2" maxlength="1000"></textarea>
          <div class="admin-fields">
            <div>
              <label for="created">Submitted</label>
              <input id="created" type="datetime-local" required>
            </div>
            <div>
              <label for="up">Up votes</label>
              <input id="up" type="number" min="0" step="1" required>
            </div>
            <div>
              <label for="down">Down votes</label>
              <input id="down" type="number" min="0" step="1" required>
            </div>
          </div>
          <label for="editor">Code</label>
          <div id="editor" class="admin-editor"></div>
        </form>
        <p id="meta" class="muted"></p>
        <div class="admin-actions">
          <button data-status="approved" class="primary">Approve</button>
          <button data-status="hidden">Hide</button>
          <button data-status="rejected">Reject</button>
          <button data-status="pending">Back to pending</button>
          <button id="save">Save changes</button>
          <span id="unsaved" class="status-warn admin-unsaved" hidden>Unsaved changes</span>
          <button id="preview" title="Preview edits (Ctrl+Enter)">Preview edits</button>
          <button id="run">Run on Stairs next</button>
          <button id="open">Open in Playground</button>
          <button id="delete">Delete</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
