<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · BBB Blinken Bulbs</title>
  <link rel="stylesheet" href="/css/site.css">
  <script type="module" src="/js/gallery.js"></script>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/">BBB Blinken Bulbs</a>
    <a href="/play/">Playground</a>
    <a href="/gallery/" aria-current="page">Gallery</a>
    <a href="/status/">Live</a>
  </nav>
  <main class="page wide">
    <div class="gallery-head">
      <h1>Gallery</h1>
      <span class="spacer"></span>
      <label class="muted" style="font-weight: normal; margin: 0">Sort by
        <select id="sort" style="width: auto">
          <option value="top">Top</option>
          <option value="new">Newest</option>
        </select>
      </label>
      <a class="button primary" href="/play/">Make your own</a>
    </div>
    <p class="muted">Shows made by the community. Vote for your favorites:
      they come up more often when no one else has a show running.</p>
    <p id="message" role="status"></p>
    <div id="grid" class="gallery-grid"></div>
    <p style="text-align: center; margin-top: 24px">
      <button id="more" hidden>Show more</button>
    </p>
  </main>
</body>
</html>
