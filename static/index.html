<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBB Blinken Bulbs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <script type="module" src="/js/gallery.js"></script>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><span class="name">BBB Blinken Bulbs</span></a>
    <a href="/" aria-current="page">Gallery</a>
    <a href="/play/">Playground</a>
    <a href="/tutorial/">Tutorial</a>
    <a href="/status/">Live</a>
  </nav>
  <main class="page wide">
    <div class="gallery-head">
      <div>
        <div id="count" class="eyebrow"></div>
        <h1>Gallery</h1>
        <p class="muted">Light shows for the 100 lights spiraling down the
          Beyster Building stairwell, made by the community. Vote for your
          favorites: they come up more often when no one else has a show
          running. New here? <a href="/tutorial/">Learn how to make
          one</a>.</p>
      </div>
      <span class="spacer"></span>
      <div class="gallery-tools">
        <div id="sort" class="segmented" role="group" aria-label="Sort by">
          <button data-sort="top" aria-pressed="true">Top</button>
          <button data-sort="new" aria-pressed="false">Newest</button>
        </div>
        <a class="button primary" href="/play/">Make your own</a>
      </div>
    </div>
    <p id="message" class="gallery-message muted" role="status"></p>
    <div id="grid" class="gallery-grid"></div>
  </main>
</body>
</html>
